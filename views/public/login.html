<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar Sesión - DELICATESSENORDER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/login_register.css" />
</head>
<body>
<!-- 
  Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
      <a class="navbar-brand" href="#">🥪 DELICATESSENORDER</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="./producto.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="./pedido.html">Pedidos</a></li>
          <li class="nav-item"><a class="nav-link" href="./login.html">Iniciar Sesión</a></li>
          <li class="nav-item"><a class="nav-link" href="./register.html">Registrarse</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Banner (IMAGEN) -->
  <div class="banner text-center mb-4">
    <img src="./imagen/banner.jpg" alt="Banner de bienvenida" class="img-fluid" style="max-height: 250px; object-fit: cover;" />
  </div>

  <!-- Formulario de Login -->
  <div class="form-container">
    <h2 class="mb-4 text-center">Iniciar Sesión</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input type="email" class="form-control" id="email" required placeholder="cliente@fiambreria.com" autocomplete="email" aria-label="Correo Electrónico" />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required placeholder="••••••••" autocomplete="current-password" aria-label="Contraseña" />
      </div>
      <button type="submit" class="btn btn-primary w-100">Ingresar</button>

      <!-- MENSAJE -->
      <div id="mensajeLogin" class="alert d-none mt-3" role="alert"></div> 
    </form>
    <p class="text-center mt-3">¿No tenés cuenta? <a href="./register.html">Registrate acá</a></p>
  </div>

  <!-- !-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="./js/auth.js"></script>
</body>
</html>
